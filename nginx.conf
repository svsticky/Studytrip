server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch the latest trip config, so the reveal shows up right away.
    location = /data/trip.json {
        add_header Cache-Control "no-store";
    }
}
